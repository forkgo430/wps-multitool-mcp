<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多面手 MCP</title>
<!--
  Input: 桥的 HTTP 状态端点（127.0.0.1:27731/status）+ 用户点击 + WPS COM 对象
  Output: 任务面板（状态 / 操作目标 / 快捷动作 / 操作记录 / 关于）
  Pos: WPS 加载项任务窗格页面。一旦我被修改，请更新我的头部注释，以及所属文件夹的md。

  v3.0（2026-10-27 面板 UI 优化）：
  - 文档切换器：通过 COM 列出当前打开的文档，点选可查看（不改 target 锁定逻辑）
  - 深色模式：prefers-color-scheme 自动跟随 WPS/系统主题
  - 操作反馈：按钮点击后加载态 + 结果提示，不再点了没反应
  - AI 活动指示：队列 > 0 时标题区显示"AI 执行中"脉冲动画
  - 卡片间距/分组微调

  v3.2（2026-10-28 决策者实测轮 · 第六任）：
  - 文档列表图标 emoji（📝📊📽🔒）全部换内联 SVG —— WPS 内嵌老内核对 emoji 渲染不稳，
    矢量图保真且跟随主题色；空态文案同步调整
  - 文档切换器兑现"点选"：点条目 = Activate 切成活动文档（事件委托 + data-app/idx），
    失败走 tip 如实回报；快照按钮在无 ActiveXObject 的内核给引导话术
  - （部署副本过期问题：WPS 内装的是 v2.3 旧面板，重跑 deploy-addon.ps1 即更新到本版）

  v3.1（2026-10-28 决策者修复轮 · 第六任）：
  - 修复状态闪跳：v3.0 改版后 render 仍写已移除的 target 区块（target-name/target-lock
    在 markup 里已不存在）→ 每 2 秒抛 TypeError → 被 poll 的 catch 误报"连不上桥"。
    死代码删除；render 全体套 try/catch，渲染错误只进 console，不再冒充连接错误
  - 最近改动：摘要与动作名同文不重复显示；同一秒内同动作同结果折叠为 ×N
  - 滚动条按主题着色；文档列表空态改用户语言
-->
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e6e8eb;
    --text: #1f2329; --dim: #8a9099;
    --accent: #3370ff; --accent-bg: #eef3ff;
    --ok: #17b978; --warn: #f58a3c; --err: #e34d59;
    --shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b1e; --card: #242528; --border: #3a3b3e;
      --text: #e8e9ea; --dim: #7a8088;
      --accent: #5b8fff; --accent-bg: #1e2a45;
      --shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    button { background: var(--card); }
    button.p { background: var(--accent); }
    .target { background: var(--accent-bg); }
    .target.none { background: transparent; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 14px;
  }
  .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .hdr .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); flex-shrink: 0; }
  .hdr.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(23,185,120,.15); }
  .hdr .name { font-size: 15px; font-weight: 600; }
  .hdr .ver { font-size: 11px; color: var(--dim); margin-left: auto; }
  .hdr .busy {
    font-size: 10px; color: var(--warn); display: none; align-items: center; gap: 4px;
  }
  .hdr .busy.show { display: inline-flex; }
  .hdr .busy::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .card h3 {
    font-size: 12px; font-weight: 600; color: var(--dim);
    margin-bottom: 10px; padding-left: 8px; border-left: 3px solid var(--accent);
    line-height: 1.2;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; }
  .row + .row { border-top: 1px dashed var(--border); }
  .row .k { color: var(--dim); }
  .row .v { font-variant-numeric: tabular-nums; text-align: right; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }

  /* 文档切换器 */
  .doclist { max-height: 140px; overflow-y: auto; }
  .doc-item {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; transition: background .1s; font-size: 12px;
  }
  .doc-item:hover { background: var(--accent-bg); cursor: pointer; }
  .doc-item.active { background: var(--accent-bg); font-weight: 500; }
  .doc-item .ico { flex-shrink: 0; font-size: 11px; display: inline-flex; align-items: center; }
  .doc-item .ico svg { display: block; color: var(--dim); }
  .doc-item.active .ico svg { color: var(--accent); }
  .tag svg { color: var(--ok); }
  .doc-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-item .tag {
    font-size: 10px; color: var(--accent); border: 1px solid currentColor;
    border-radius: 3px; padding: 0 4px; flex-shrink: 0;
  }
  .doc-empty { color: var(--dim); font-size: 12px; padding: 8px 0; text-align: center; }

  .target {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    background: var(--accent-bg); border: 1px solid #d6e2ff; border-radius: 8px;
  }
  .target.none { background: transparent; border-color: var(--border); color: var(--dim); }
  .target .name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target .lock {
    font-size: 11px; color: var(--accent); border: 1px solid currentColor;
    border-radius: 4px; padding: 1px 6px; flex-shrink: 0;
  }
  .target.none .lock { color: var(--dim); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 7px; line-height: 1.5; }

  .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  button {
    font: inherit; font-size: 12px; padding: 8px 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 7px; cursor: pointer; transition: all .12s;
    position: relative; overflow: hidden;
  }
  button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  button:active { transform: translateY(1px); }
  button.p { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.p:hover { background: #2860e0; color: #fff; }
  button.w { color: var(--warn); border-color: #ffd9b8; }
  button.w:hover { background: #fff6ec; border-color: var(--warn); color: var(--warn); }
  button.loading { pointer-events: none; opacity: .6; }
  button.loading::after {
    content: ''; position: absolute; right: 6px; top: 50%; margin-top: -5px;
    width: 10px; height: 10px; border: 2px solid transparent;
    border-top-color: currentColor; border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  .log { max-height: 200px; overflow-y: auto; margin: -4px 0; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .item .x { color: var(--dim); font-weight: 600; }
  .log .item { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; align-items: baseline; }
  .log .item + .item { border-top: 1px dashed var(--border); }
  .log .t { color: var(--dim); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 11px; }
  .log .a { font-weight: 500; flex-shrink: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .s { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .item.fail .a { color: var(--err); }
  .log .empty { color: var(--dim); font-size: 12px; padding: 10px 0; text-align: center; }

  .about { font-size: 12px; line-height: 1.9; }
  .about .kv { display: flex; gap: 8px; }
  .about .kv .k { color: var(--dim); width: 46px; flex-shrink: 0; }
  .about ul { margin: 6px 0 0 16px; color: var(--dim); }
  .about .foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 11px; }
  .tip {
    margin-top: 8px; padding: 7px 10px; border-radius: 6px; font-size: 12px;
    background: #fff6ec; color: #a05a10; border: 1px solid #ffd9b8; display: none;
  }
  .tip.show { display: block; }
  @media (prefers-color-scheme: dark) {
    .tip { background: #2a2518; color: #d4a850; border-color: #4a3a20; }
  }
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <span class="dot"></span>
  <span class="name">多面手 MCP</span>
  <span class="busy" id="busy">AI 执行中</span>
  <span class="ver">v1.0.4</span>
</div>

<div class="card">
  <h3>桥状态</h3>
  <div class="row"><span class="k">桥进程</span><span class="v" id="v-bridge">—</span></div>
  <div class="row"><span class="k">当前应用</span><span class="v" id="v-app">—</span></div>
  <div class="row"><span class="k">队列</span><span class="v" id="v-queue">—</span></div>
  <div class="tip" id="tip"></div>
</div>

<div class="card">
  <h3>打开的文档</h3>
  <div class="doclist" id="doclist"><div class="doc-empty">轮询中…</div></div>
  <div class="hint">列表来自 WPS COM 实时查询。带「当前」标记的 = AI 默认写这份。</div>
</div>

<div class="card">
  <h3>快捷动作</h3>
  <div class="bar">
    <button onclick="act('save',this)">保存</button>
    <button onclick="act('undo',this)">撤销</button>
    <button onclick="act('pdf',this)">导出 PDF</button>
    <button onclick="act('snap',this)">快照</button>
    <button class="w" onclick="act('unstick',this)">解除卡死</button>
  </div>
  <div class="hint">更多能力用 MCP 工具调用，默认列 40 个基础工具。</div>
</div>

<div class="card">
  <h3>最近改动</h3>
  <div class="log" id="log"><div class="empty">暂无记录</div></div>
</div>

<div class="card">
  <h3>关于</h3>
  <div class="about">
    <div class="kv"><span class="k">版本</span><span>1.0.4</span></div>
    <div class="kv"><span class="k">作者</span><span>赢容</span></div>
    <div class="kv"><span class="k">许可</span><span>MIT</span></div>
    <ul>
      <li>288 个 MCP 工具，默认只列 40 个基础工具</li>
      <li>常驻桥进程，冷启动后 2~3ms/次</li>
      <li>快照 / 撤销 / 导出 / 诊断</li>
    </ul>
  </div>
</div>

<script>
var ENDPOINT = 'http://127.0.0.1:' + (window.__PORT__ || 27731) + '/status';
var tipTimer = null;

function fmtUptime(ms) {
  var s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60); s = s % 60;
  if (m < 60) return m + 'm' + s + 's';
  var h = Math.floor(m / 60); m = m % 60;
  return h + 'h' + m + 'm';
}
function fmtTime(t) {
  var d = new Date(t);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(id) { return document.getElementById(id); }

function tip(msg, kind) {
  var el = $('tip');
  el.textContent = msg;
  el.className = 'tip show' + (kind ? ' ' + kind : '');
  if (tipTimer) clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { el.className = 'tip'; }, 4000);
}

/* 文档切换器：通过 COM 查询打开的文档 */
var DOC_ICONS = {
  // 内联 SVG：WPS 内嵌内核（含老 CEF）对 emoji 渲染不稳，矢量图保真且跟随主题色（v3.2）
  word: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 8h4.6M6.2 10.4h4.6M6.2 12.8h2.8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>',
  excel: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.2h12M2 10.2h12M6.2 2v12M10.2 2v12" stroke="currentColor" stroke-width="1" fill="none"/></svg>',
  ppt: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="3" width="12" height="7.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 10.5v2M5.5 13h5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>',
  lock: '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" style="vertical-align:-1px"><rect x="3.5" y="7" width="9" height="6.5" rx="1" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
};

function listDocs() {
  try {
    var A = window.Application;
    if (!A) { $('doclist').innerHTML = '<div class="doc-empty">在 WPS 内打开面板可查看文档列表</div>'; return; }
    var items = [];
    if (A.Documents) {
      var n = A.Documents.Count;
      for (var i = 1; i <= n; i++) {
        var d = A.Documents.Item(i);
        items.push({ app: 'word', idx: i, name: d.Name || '未命名', active: A.ActiveDocument && A.ActiveDocument.Name === d.Name });
      }
    }
    if (A.Workbooks) {
      var wn = A.Workbooks.Count;
      for (var j = 1; j <= wn; j++) {
        var w = A.Workbooks.Item(j);
        items.push({ app: 'excel', idx: j, name: w.Name || '未命名', active: A.ActiveWorkbook && A.ActiveWorkbook.Name === w.Name });
      }
    }
    if (A.Presentations) {
      var pn = A.Presentations.Count;
      for (var k = 1; k <= pn; k++) {
        var pr = A.Presentations.Item(k);
        items.push({ app: 'ppt', idx: k, name: pr.Name || '未命名', active: A.ActivePresentation && A.ActivePresentation.Name === pr.Name });
      }
    }
    if (!items.length) { $('doclist').innerHTML = '<div class="doc-empty">没有打开的文档</div>'; return; }
    $('doclist').innerHTML = items.map(function (it) {
      return '<div class="doc-item' + (it.active ? ' active' : '') + '" data-app="' + it.app + '" data-idx="' + it.idx + '">' +
        '<span class="ico">' + (DOC_ICONS[it.app] || '') + '</span>' +
        '<span class="nm">' + esc(it.name) + '</span>' +
        (it.active ? '<span class="tag">' + DOC_ICONS.lock + ' 当前</span>' : '') +
        '</div>';
    }).join('');
  } catch (e) {
    $('doclist').innerHTML = '<div class="doc-empty">查询失败: ' + esc(e.message) + '</div>';
  }
}

function render(d) {
  // 渲染错误只进 console —— 不许被 poll 的 catch 误判成"连不上桥"（v3.1 闪跳修复）
  try { renderImpl(d); } catch (e) { if (window.console && console.warn) console.warn('panel render:', e && e.message); }
}

function renderImpl(d) {
  $('hdr').className = (d.uptimeMs > 0) ? 'hdr on' : 'hdr';

  $('v-bridge').innerHTML = d.uptimeMs > 0
    ? '<span class="ok">已连接 · ' + fmtUptime(d.uptimeMs) + '</span>'
    : '<span class="err">未连接</span>';

  var running = d.appsRunning || [];
  $('v-app').textContent = running.length
    ? running.join(' / ') + '（' + running.length + ' 路）'
    : '未附着（用到自动起）';

  var q = d.queued || 0;
  var qEl = $('v-queue');
  qEl.textContent = q + ' / ' + d.queueMax;
  qEl.className = 'v' + (q >= d.queueMax ? ' err' : (q > 0 ? ' warn' : ' ok'));

  // AI 活动指示：队列 > 0 显示"AI 执行中"
  $('busy').className = 'busy' + (q > 0 ? ' show' : '');

  // 最近改动
  var recent = d.recent || [];
  var log = $('log');
  if (!recent.length) {
    log.innerHTML = '<div class="empty">暂无记录</div>';
  } else {
    log.innerHTML = (function () {
      var rows = [];
      for (var i = 0; i < recent.length; i++) {
        var e = recent[i];
        var s = (e.summary && e.summary !== e.action) ? e.summary : '';
        var p = rows[rows.length - 1];
        if (p && p.a === e.action && p.s === s && p.ok === e.ok && fmtTime(p.t) === fmtTime(e.t)) { p.n++; continue; }
        rows.push({ a: e.action, s: s, ok: e.ok, t: e.t, n: 1 });
      }
      return rows.map(function (r) {
        return '<div class="item' + (r.ok ? '' : ' fail') + '">' +
          '<span class="t">' + fmtTime(r.t) + '</span>' +
          '<span class="a">' + esc(r.a) + (r.n > 1 ? ' <span class="x">×' + r.n + '</span>' : '') + '</span>' +
          (r.s ? '<span class="s">' + esc(r.s) + '</span>' : '') + '</div>';
      }).join('');
    })();
  }

  // 操作目标：v3.0 起由文档列表的 🔒 活动文档标记承担，此处不再渲染（原 target-* 元素已移除）
}

function poll() {
  fetch(ENDPOINT).then(function (r) { return r.json(); }).then(function (d) {
    render(d);
    listDocs();
  }).catch(function () {
    $('hdr').className = 'hdr';
    $('v-bridge').innerHTML = '<span class="err">连不上桥</span>';
    $('doclist').innerHTML = '<div class="doc-empty">桥未连接</div>';
  });
}

/* 操作按钮：加载态 + 结果提示 */
function act(what, btn) {
  if (btn) { btn.classList.add('loading'); }
  setTimeout(function () {
    try {
      var A = window.Application;
      if (!A) { tip('拿不到 WPS 应用对象'); return; }

      if (what === 'save') {
        if (A.ActiveDocument) { A.ActiveDocument.Save(); tip('已保存当前文档'); }
        else tip('没有活动文档');
      } else if (what === 'undo') {
        if (A.Undo) { A.Undo(); tip('已撤销一步'); }
        else tip('本机 WPS 不支持 Undo');
      } else if (what === 'pdf') {
        var d = A.ActiveDocument;
        if (!d) { tip('没有活动文档'); return; }
        var base = (d.FullName || d.Name || '导出').replace(/\.[^.]+$/, '');
        var out = base + '_' + stamp() + '.pdf';
        d.ExportAsFixedFormat(out, 17, false);
        tip('已导出：' + out);
      } else if (what === 'snap') {
        var d3 = A.ActiveDocument;
        if (!d3 || !d3.FullName) { tip('文档未保存到磁盘，无法建快照'); return; }
        if (typeof ActiveXObject === 'undefined') {
          // CEF 等非 IE 内核没有 ActiveXObject —— 如实引导，不甩生硬报错（v3.2 实测轮）
          tip('当前 WPS 内核不支持面板内建快照，请让 AI 用快照工具（等价能力）');
          return;
        }
        var fso = new ActiveXObject('Scripting.FileSystemObject');
        var sdir = d3.FullName.replace(/[^\\]*$/, '') + '.mcp-snapshots\\';
        if (!fso.FolderExists(sdir)) fso.CreateFolder(sdir);
        var sbase = (d3.Name || 'doc').replace(/\.[^.]+$/, '');
        var sext = (d3.Name || '').match(/\.[^.]+$/) || [''];
        var sout = sdir + sbase + '_' + stamp() + sext[0];
        fso.CopyFile(d3.FullName, sout, true);
        tip('已建快照：' + sout);
      } else if (what === 'unstick') {
        try { A.Calculation = -4135; } catch (e1) {}
        try { A.ScreenUpdating = false; } catch (e2) {}
        try { A.Calculation = -4105; A.ScreenUpdating = true; } catch (e3) {}
        tip('已尝试解除卡死；若仍卡请关掉 WPS 对话框或重启');
      }
    } catch (e) {
      tip('失败：' + e.message);
    } finally {
      if (btn) btn.classList.remove('loading');
    }
  }, 50);
}

function stamp() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

poll();
setInterval(poll, 2000);

// 文档切换器：点选 = 把该文档切成活动文档（v3.2 兑现头部注释"点选可查看"）
// 事件委托挂在 #doclist 上——列表每 2 秒重渲染，逐项绑会丢
document.getElementById('doclist').addEventListener('click', function (ev) {
  var item = ev.target.closest ? ev.target.closest('.doc-item') : null;
  if (!item) return;
  var A = window.Application;
  if (!A) { tip('请在 WPS 内打开面板'); return; }
  var app = item.getAttribute('data-app');
  var idx = Number(item.getAttribute('data-idx'));
  var col = app === 'word' ? A.Documents : app === 'excel' ? A.Workbooks : A.Presentations;
  if (!col || !col.Item) { tip('该类型在当前宿主不可见'); return; }
  try {
    var d = col.Item(idx);
    if (d && d.Activate) {
      d.Activate();
      tip('已切换到 ' + (d.Name || ('第 ' + idx + ' 份')));
    } else {
      tip('此文档不支持切换');
    }
    listDocs();
  } catch (e) {
    tip('切换失败：' + (e && e.message ? e.message : e));
  }
});
</script>
</body>
</html>
